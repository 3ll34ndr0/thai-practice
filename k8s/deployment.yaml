apiVersion: apps/v1
kind: Deployment
metadata:
  name: thai-practice
  namespace: thai-practice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: thai-practice
  template:
    metadata:
      labels:
        app: thai-practice
    spec:
      containers:
        - name: thai-practice
          image: ghcr.io/3ll34ndr0/thai-practice:bootstrap
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8123
          envFrom:
            - secretRef:
                name: thai-practice-secrets
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
