# Place at /etc/nginx/sites-available/t.marso.ar.conf on the VPS,
# then: ln -s /etc/nginx/sites-available/t.marso.ar.conf /etc/nginx/sites-enabled/
#
# Run certbot AFTER this file is enabled with plain HTTP first:
#   certbot --nginx -d t.marso.ar
# certbot will rewrite this file to add the SSL server block + redirect.

upstream thai_practice {
    server 127.0.0.1:8123;
}

server {
    server_name t.marso.ar;

    client_max_body_size 2m;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;

    location / {
        proxy_pass http://thai_practice;
    }

    listen 80;
}
